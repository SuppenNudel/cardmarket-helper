<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardmarket Helper Configuration</title>
    <link rel="stylesheet" href="../css/master.min.css">
    <style>
        :root {
            --bg-start: #f3f7fb;
            --bg-end: #e8eef6;
            --card-bg: #ffffff;
            --text-main: #172538;
            --text-muted: #5d6c80;
            --accent: #1776d2;
            --accent-soft: #cfe6fb;
            --surface-border: #d6e0ea;
            --shadow: 0 14px 40px rgba(14, 35, 61, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Trebuchet MS", "Helvetica Neue", sans-serif;
            background: radial-gradient(circle at 15% 15%, #ffffff 0%, var(--bg-start) 45%, var(--bg-end) 100%);
            color: var(--text-main);
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .settings-card {
            width: min(720px, 100%);
            background: linear-gradient(180deg, #ffffff 0%, #f9fbfe 100%);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .settings-header {
            padding: 20px 22px;
            border-bottom: 1px solid var(--surface-border);
            background: linear-gradient(90deg, #f8fbff 0%, #eef5fc 100%);
        }

        .settings-title {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .settings-subtitle {
            margin: 6px 0 0;
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .settings-content {
            padding: 22px;
        }

        .setting-row {
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            background: var(--card-bg);
            padding: 14px;
        }

        .setting-row + .setting-row {
            margin-top: 12px;
        }

        .setting-label {
            margin: 0 0 8px;
            font-weight: 600;
            color: var(--text-main);
            display: block;
        }

        .setting-controls {
            display: grid;
            grid-template-columns: auto 64px 1fr;
            align-items: center;
            gap: 10px;
        }

        .value-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            border-radius: 8px;
            border: 1px solid var(--surface-border);
            background: #f7faff;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--accent);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #c8d6e5;
            transition: 0.2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #ffffff;
            transition: 0.2s;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        input:checked + .slider {
            background-color: var(--accent);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .settings-note {
            margin: 12px 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            background: var(--accent-soft);
            border: 1px solid #b7d9f8;
            border-radius: 8px;
            padding: 8px 10px;
        }

        .setting-section-title {
            margin: 0 0 12px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
        }

        .setting-fields-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 10px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .label-with-icon {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .setting-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            min-width: 16px;
            line-height: 1;
        }

        .field-group input[type="number"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            background: #f7faff;
            color: var(--text-main);
            font-size: 0.95rem;
            font-variant-numeric: tabular-nums;
            accent-color: var(--accent);
            outline: none;
            transition: border-color 0.15s;
        }

        .field-group input[type="number"]:focus {
            border-color: var(--accent);
            background: #ffffff;
        }

        .field-group select {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            background: #f7faff;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .field-group select:focus {
            border-color: var(--accent);
            background: #ffffff;
        }

        @media (max-width: 600px) {
            .settings-content {
                padding: 16px;
            }

            .setting-controls {
                grid-template-columns: auto 56px 1fr;
            }

            .setting-fields-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>
    <main class="settings-card">
        <header class="settings-header">
            <h1 class="settings-title">Cardmarket Helper Settings</h1>
            <p class="settings-subtitle">Fine-tune the extension behavior for your browsing workflow.</p>
        </header>

        <section class="settings-content">
            <div class="setting-row">
                <label class="setting-label label-with-icon" for="thumbnail-range">
                    <span class="setting-icon fonticon fonticon-camera" aria-hidden="true"></span>
                    <span>Thumbnail size (height)</span>
                </label>
                <div class="setting-controls">
                    <label class="switch" aria-label="Enable product thumbnails">
                        <input id="thumbnail-switch" type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <span id="output" class="value-badge">150</span>
                    <input type="range" step="25" min="50" max="300" value="150" id="thumbnail-range">
                </div>
            </div>

            <div class="setting-row">
                <p class="setting-section-title">Price Autofill — Rival definition</p>
                <div class="setting-fields-grid">
                    <div class="field-group">
                        <label for="pa-minRivalSales">Min rival sales</label>
                        <input type="number" id="pa-minRivalSales" min="0" step="10">
                    </div>
                    <div class="field-group">
                        <label for="pa-minRivalAvailableItems">Min rival stock</label>
                        <input type="number" id="pa-minRivalAvailableItems" min="0" step="10">
                    </div>
                </div>

                <p class="setting-section-title" style="margin-top: 14px;">Price Autofill — Price calculation</p>
                <div class="setting-fields-grid">
                    <div class="field-group">
                        <label for="pa-priceSource">Price source</label>
                        <select id="pa-priceSource">
                            <option value="lowestRival">Lowest Rival</option>
                            <option value="low">LOW</option>
                            <option value="avg7">AVG7</option>
                            <option value="avg30">AVG30</option>
                            <option value="avg1">AVG1</option>
                            <option value="trend">TREND</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="pa-undercutMode">Undercut type</label>
                        <select id="pa-undercutMode">
                            <option value="fixed">Fixed amount</option>
                            <option value="percent">Percentage</option>
                        </select>
                    </div>
                    <div class="field-group">
                        <label for="pa-undercutValue">Undercut value</label>
                        <input type="number" id="pa-undercutValue" min="0" step="0.01">
                    </div>
                    <div class="field-group">
                        <label for="pa-minimumPrice">Minimum price</label>
                        <input type="number" id="pa-minimumPrice" min="0" step="0.01">
                    </div>
                </div>

                <p class="setting-section-title" style="margin-top: 14px;">Price Autofill — Seller types to include</p>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="pa-includeCalculatedRivals">
                        <span>🤺 Calculated rivals (based on your thresholds)</span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="pa-includePowersellers">
                        <span class="label-with-icon">
                            <span class="setting-icon fonticon fonticon-users-powerseller" aria-hidden="true"></span>
                            <span>Powersellers</span>
                        </span>
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="pa-includeProfessional">
                        <span class="label-with-icon">
                            <span class="setting-icon fonticon fonticon-users-professional" aria-hidden="true"></span>
                            <span>Professional sellers</span>
                        </span>
                    </label>
                </div>
            </div>

            <p class="settings-note">Changes are saved automatically.</p>
        </section>
    </main>
